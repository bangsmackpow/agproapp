#:schema node_modules/wrangler/config-schema.json

# ─────────────────────────────────────────────────────────────────────────────
# AG Pro Solutions — edge-native business management
#
# One Worker for everything: /api/* is served by Hono, every other path by
# React Router SSR. There is no separate staging deployment — locally you run
# against a local D1, and this top-level configuration is what ships to
# Cloudflare.
# ─────────────────────────────────────────────────────────────────────────────

name = "agproapp"
main = "workers/app.ts"

# Pinned to the newest date supported by the workerd binary bundled with
# @cloudflare/vitest-pool-workers, so dev, test and production all execute
# identical runtime behaviour.
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# ── Observability ────────────────────────────────────────────────────────────
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

# ── Data bindings ────────────────────────────────────────────────────────────
# Migrations are generated by drizzle-kit into ./migrations and applied with
# `wrangler d1 migrations apply`.
[[d1_databases]]
binding = "DB"
database_name = "agpro-db"
database_id = "fa197b3f-d0cd-4138-9065-8ecf67b6484f"
migrations_dir = "migrations"

# Source documents: scanned vendor invoices, Channel BOLs, price sheets.
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "agpro-documents"

# Session / cache namespace.
[[kv_namespaces]]
binding = "KV"
id = "5acd33dcc3f940f3ab2410147b5c973a"

[vars]
# The deployed truth. Local development overrides this in .dev.vars, so session
# cookies are only marked Secure on a real HTTPS deployment.
ENVIRONMENT = "production"
APP_NAME = "AG Pro Solutions"
APP_REGION = "Creston, IA"

# Outgoing invoice mail. The API key is a secret, not a var:
#   wrangler secret put MAIL_PROVIDER_API_KEY
MAIL_FROM = "AG Pro Solutions <invoices@example.com>"
MAIL_REPLY_TO = ""
