#:schema node_modules/wrangler/config-schema.json

# ─────────────────────────────────────────────────────────────────────────────
# AG Pro Solutions — edge-native business management
# Single Worker: Hono API on /api/*, React Router SSR for the UI (Phase 3).
# ─────────────────────────────────────────────────────────────────────────────

name = "agproapp"
main = "src/worker.ts"
# Pinned to the newest date supported by the workerd binary bundled with
# @cloudflare/vitest-pool-workers, so dev, test and production all run the same
# runtime behaviour.
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# ── Connect / observability ──────────────────────────────────────────────────
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

# ── Data bindings ────────────────────────────────────────────────────────────
# SQL engine. Migrations are generated by drizzle-kit into ./migrations and
# applied with `wrangler d1 migrations apply`.
[[d1_databases]]
binding = "DB"
database_name = "agpro-db"
database_id = "fa197b3f-d0cd-4138-9065-8ecf67b6484f"
migrations_dir = "migrations"

# Source documents: scanned vendor invoices, Channel BOLs, seed BOLs, XLSX.
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "agpro-documents"

# Session / rate-limit / short-lived token cache.
[[kv_namespaces]]
binding = "KV"
id = "5acd33dcc3f940f3ab2410147b5c973a"

[vars]
ENVIRONMENT = "development"
APP_NAME = "AG Pro Solutions"
APP_REGION = "Creston, IA"

# ─────────────────────────────────────────────────────────────────────────────
# Staging
# ─────────────────────────────────────────────────────────────────────────────
[env.staging]
name = "agproapp-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME = "AG Pro Solutions"
APP_REGION = "Creston, IA"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "agpro-db-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "agpro-documents-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

# ─────────────────────────────────────────────────────────────────────────────
# Production
# ─────────────────────────────────────────────────────────────────────────────
[env.production]
name = "agproapp-production"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"
APP_NAME = "AG Pro Solutions"
APP_REGION = "Creston, IA"

[[env.production.d1_databases]]
binding = "DB"
database_name = "agpro-db-production"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "agpro-documents-production"

[[env.production.kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
